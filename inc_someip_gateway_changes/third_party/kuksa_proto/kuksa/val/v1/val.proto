syntax = "proto3";
package kuksa.val.v1;

import "kuksa/val/v1/types.proto";

enum View {
  VIEW_UNSPECIFIED = 0;
  VIEW_CURRENT_VALUE = 1;
  VIEW_TARGET_VALUE = 2;
  VIEW_METADATA = 3;
  VIEW_FIELDS = 10;
  VIEW_ALL = 20;
}
message Error { uint32 code = 1; bytes reason = 2; string message = 3; }
message SetError { string path = 1; Error error = 2; }
message EntryRequest { string path = 1; View view = 2; repeated Field fields = 3; }
message GetRequest { repeated EntryRequest entries = 1; }
message DataEntry { string path = 1; Datapoint value = 2; Datapoint actuator_target = 3; Metadata metadata = 4; }
message GetResponse { repeated DataEntry entries = 1; repeated Error errors = 2; }
message SetRequest { repeated EntryUpdate updates = 1; }
message SetResponse { repeated SetError errors = 2; }
message SubscribeEntry { string path = 1; View view = 2; repeated Field fields = 3; }
message SubscribeRequest { repeated SubscribeEntry entries = 1; }
message SubscribeResponse { repeated EntryUpdate updates = 1; }
message GetServerInfoRequest {}
message GetServerInfoResponse { string name = 1; string version = 2; }

service VAL {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
}
