name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --workspace

      - name: Check native bridge feature
        run: MW_COM_NATIVE_BUILD_BRIDGE=1 cargo check --features mw-com-native

  codegen:
    name: Codegen verification
    runs-on: ubuntu-latest
    if: vars.MW_COM_CODEGEN_GIT_URL != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Verify generated artifacts
        env:
          MW_COM_CODEGEN_GIT_URL: ${{ vars.MW_COM_CODEGEN_GIT_URL }}
          MW_COM_CODEGEN_GIT_REF: ${{ vars.MW_COM_CODEGEN_GIT_REF }}
        run: cargo run -p xtask -- verify-codegen