{% extends "base.html" %}
{% block scripts %}
<script src="{{ 'assets/mermaid.min.js' | url }}"></script>
{{ super() }}
{% endblock %}
{% block content %}
<nav class="handbook-breadcrumbs" aria-label="Breadcrumb">
  <a href="{{ 'index.html' | url }}">Component Map</a>
  {% for parent in page.ancestors | reverse %}
    <span aria-hidden="true"> / </span><span>{{ parent.title }}</span>
  {% endfor %}
  <span aria-hidden="true"> / </span><span aria-current="page">{{ page.title }}</span>
</nav>
{{ super() }}
{% endblock %}
