#cloud-config
hostname: vm1
manage_etc_hosts: true
users:
  - name: ubuntu
    gecos: Ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    passwd: $6$rounds=4096$dummy$dummydummydummydummydummydummy
ssh_pwauth: true
chpasswd:
  list: |
    ubuntu:ubuntu
  expire: false
packages:
  - openssh-server
# Use DHCP with a wildcard match since virtio NIC names vary (eth0/enp0s1/enX)
network:
  version: 2
  ethernets:
    anynic:
      match:
        name: "en*"
      dhcp4: true
      dhcp-identifier: mac

runcmd:
  # stop/mask the wait-online service to avoid long waits if DHCP is briefly unavailable
  - [ sh, -c, 'systemctl mask systemd-networkd-wait-online.service || true' ]
  - [ sh, -c, 'systemctl stop systemd-networkd-wait-online.service || true' ]
  - [ sh, -c, 'echo "cloud-init finished for vm1; DHCP requested"' ]
